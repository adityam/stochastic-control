<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      // CNI schedule links lectures 7–10 as *.qmd; GitHub Pages cannot serve
      // those as HTML, so missing *.qmd paths land here and we bounce to the
      // rendered lecture pages.
      var map = {
        "lecture-07.qmd": "lectures/pomdps.html",
        "lecture-08.qmd": "lectures/ais.html",
        "lecture-09.qmd": "lectures/certainty-equivalence.html",
        "lecture-10.qmd": "lectures/learning.html",
        "lecture-07.html": "lectures/pomdps.html",
        "lecture-08.html": "lectures/ais.html",
        "lecture-09.html": "lectures/certainty-equivalence.html",
        "lecture-10.html": "lectures/learning.html"
      };
      var path = window.location.pathname.replace(/\/+$/, "");
      var parts = path.split("/");
      var name = parts[parts.length - 1];
      var base = path.indexOf("/AIS-course/") === 0 ? "/AIS-course/" : "/";
      var target = map[name];
      if (target) {
        var url = base + target + window.location.search + window.location.hash;
        var meta = document.createElement("meta");
        meta.httpEquiv = "refresh";
        meta.content = "0;url=" + url;
        document.head.appendChild(meta);
        window.location.replace(url);
      }
    })();
  </script>
</head>
<body>
  <p>If you are not redirected automatically, open the lecture notes:</p>
  <ul>
    <li><a href="/AIS-course/lectures/pomdps.html">Lecture 7: POMDPs and information states</a></li>
    <li><a href="/AIS-course/lectures/ais.html">Lecture 8: Approximate information state</a></li>
    <li><a href="/AIS-course/lectures/certainty-equivalence.html">Lecture 9: Certainty equivalence in POMDPs</a></li>
    <li><a href="/AIS-course/lectures/learning.html">Lecture 10: From approximation bounds to learning</a></li>
    <li><a href="/AIS-course/">Course outline</a></li>
  </ul>
</body>
</html>

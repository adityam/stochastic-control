<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" font-family="'Latin Modern Math','STIX Two Math','Times New Roman',serif" font-size="14">
  <style>
    .edge { stroke:#6c757d; stroke-width:1.6; fill:none; }
    .thin { stroke:#adb5bd; stroke-width:1.1; fill:none; }
    .dec  { fill:#ffffff; stroke:#0d6efd; stroke-width:1.7; }
    .ch   { fill:#ffffff; stroke:#198754; stroke-width:1.7; }
    .term { fill:#ffffff; stroke:#adb5bd; stroke-width:1.2; }
    .info { fill:none; stroke:#dc3545; stroke-width:1.4; stroke-dasharray:5,4; }
    .lbl  { fill:#212529; }
    .plbl { fill:#495057; font-size:12px; }
    .rlbl { fill:#212529; font-weight:500; font-size:12px; }
    .box  { fill:#ffffff; }
    .info-lbl { fill:#dc3545; font-size:12px; font-style:italic; }
  </style>

  <!-- legend: information states only (decision/chance introduced in the first figure) -->
  <g transform="translate(20,20)" class="plbl">
    <line class="info" x1="0" y1="6" x2="24" y2="6"/>
    <text x="30" y="10">information state</text>
  </g>

  <!-- Root: chance (S,Y) -->
  <circle class="ch" cx="60" cy="310" r="8"/>
  <text class="plbl" x="60" y="295" text-anchor="middle">(S,Y)</text>

  <!-- Four (S,Y) branches to four decision nodes -->
  <!-- S=sun, Y=left    (top-most) -->
  <line class="edge" x1="60" y1="310" x2="220" y2="80"/>
  <rect class="box" x="90" y="185" width="150" height="18"/>
  <text class="lbl" x="165" y="198" text-anchor="middle">S=sun, Y=left, 1/4</text>
  <rect class="dec" x="213" y="73" width="14" height="14"/>

  <!-- S=sun, Y=right -->
  <line class="edge" x1="60" y1="310" x2="220" y2="220"/>
  <rect class="box" x="90" y="255" width="150" height="18"/>
  <text class="lbl" x="165" y="268" text-anchor="middle">S=sun, Y=right, 1/4</text>
  <rect class="dec" x="213" y="213" width="14" height="14"/>

  <!-- S=rain, Y=left -->
  <line class="edge" x1="60" y1="310" x2="220" y2="400"/>
  <rect class="box" x="90" y="350" width="150" height="18"/>
  <text class="lbl" x="165" y="363" text-anchor="middle">S=rain, Y=left, 1/4</text>
  <rect class="dec" x="213" y="393" width="14" height="14"/>

  <!-- S=rain, Y=right -->
  <line class="edge" x1="60" y1="310" x2="220" y2="540"/>
  <rect class="box" x="90" y="420" width="150" height="18"/>
  <text class="lbl" x="165" y="433" text-anchor="middle">S=rain, Y=right, 1/4</text>
  <rect class="dec" x="213" y="533" width="14" height="14"/>

  <!-- Information states that group decision nodes with the same S -->
  <rect class="info" x="203" y="63" width="34" height="174" rx="10"/>
  <text class="info-lbl" x="180" y="150" text-anchor="middle" transform="rotate(-90 180 150)">S = sunny</text>

  <rect class="info" x="203" y="383" width="34" height="174" rx="10"/>
  <text class="info-lbl" x="180" y="470" text-anchor="middle" transform="rotate(-90 180 470)">S = rainy</text>

  <!-- ============= Subtree A: S=sun, Y=left  ============= -->
  <line class="edge" x1="227" y1="80" x2="330" y2="50"/>
  <rect class="box" x="255" y="55" width="40" height="14"/>
  <text class="lbl" x="275" y="66" text-anchor="middle">a=10</text>
  <circle class="ch" cx="330" cy="50" r="6"/>

  <line class="edge" x1="227" y1="80" x2="330" y2="110"/>
  <rect class="box" x="255" y="87" width="40" height="14"/>
  <text class="lbl" x="275" y="98" text-anchor="middle">a=20</text>
  <circle class="ch" cx="330" cy="110" r="6"/>

  <line class="thin" x1="330" y1="50" x2="440" y2="34"/>
  <circle class="term" cx="440" cy="34" r="3.5"/>
  <text class="rlbl" x="450" y="38">r=0   (w=5)</text>
  <line class="thin" x1="330" y1="50" x2="440" y2="66"/>
  <circle class="term" cx="440" cy="66" r="3.5"/>
  <text class="rlbl" x="450" y="70">r=10 (w=20)</text>

  <line class="thin" x1="330" y1="110" x2="440" y2="94"/>
  <circle class="term" cx="440" cy="94" r="3.5"/>
  <text class="rlbl" x="450" y="98">r=&#8722;10 (w=5)</text>
  <line class="thin" x1="330" y1="110" x2="440" y2="126"/>
  <circle class="term" cx="440" cy="126" r="3.5"/>
  <text class="rlbl" x="450" y="130">r=20 (w=20)</text>

  <!-- Q-values note for subtree A (using P(W|S=sun) = (1/4,3/4)) -->
  <g transform="translate(600,60)">
    <text class="plbl" x="0" y="0">Q(sun,·,·) subtree:</text>
    <text class="plbl" x="0" y="16">Q(a=10)  = 7.5</text>
    <text class="plbl" x="0" y="32">Q(a=20)  = 12.5</text>
  </g>

  <!-- ============= Subtree B: S=sun, Y=right  ============= -->
  <line class="edge" x1="227" y1="220" x2="330" y2="190"/>
  <rect class="box" x="255" y="195" width="40" height="14"/>
  <text class="lbl" x="275" y="206" text-anchor="middle">a=10</text>
  <circle class="ch" cx="330" cy="190" r="6"/>

  <line class="edge" x1="227" y1="220" x2="330" y2="250"/>
  <rect class="box" x="255" y="227" width="40" height="14"/>
  <text class="lbl" x="275" y="238" text-anchor="middle">a=20</text>
  <circle class="ch" cx="330" cy="250" r="6"/>

  <line class="thin" x1="330" y1="190" x2="440" y2="174"/>
  <circle class="term" cx="440" cy="174" r="3.5"/>
  <text class="rlbl" x="450" y="178">r=0   (w=5)</text>
  <line class="thin" x1="330" y1="190" x2="440" y2="206"/>
  <circle class="term" cx="440" cy="206" r="3.5"/>
  <text class="rlbl" x="450" y="210">r=10 (w=20)</text>

  <line class="thin" x1="330" y1="250" x2="440" y2="234"/>
  <circle class="term" cx="440" cy="234" r="3.5"/>
  <text class="rlbl" x="450" y="238">r=&#8722;10 (w=5)</text>
  <line class="thin" x1="330" y1="250" x2="440" y2="266"/>
  <circle class="term" cx="440" cy="266" r="3.5"/>
  <text class="rlbl" x="450" y="270">r=20 (w=20)</text>

  <g transform="translate(600,200)">
    <text class="plbl" x="0" y="0">Q(sun,·,·) subtree:</text>
    <text class="plbl" x="0" y="16">Q(a=10)  = 7.5</text>
    <text class="plbl" x="0" y="32">Q(a=20)  = 12.5</text>
  </g>

  <!-- ============= Subtree C: S=rain, Y=left  ============= -->
  <line class="edge" x1="227" y1="400" x2="330" y2="370"/>
  <rect class="box" x="255" y="375" width="40" height="14"/>
  <text class="lbl" x="275" y="386" text-anchor="middle">a=10</text>
  <circle class="ch" cx="330" cy="370" r="6"/>

  <line class="edge" x1="227" y1="400" x2="330" y2="430"/>
  <rect class="box" x="255" y="407" width="40" height="14"/>
  <text class="lbl" x="275" y="418" text-anchor="middle">a=20</text>
  <circle class="ch" cx="330" cy="430" r="6"/>

  <line class="thin" x1="330" y1="370" x2="440" y2="354"/>
  <circle class="term" cx="440" cy="354" r="3.5"/>
  <text class="rlbl" x="450" y="358">r=0   (w=5)</text>
  <line class="thin" x1="330" y1="370" x2="440" y2="386"/>
  <circle class="term" cx="440" cy="386" r="3.5"/>
  <text class="rlbl" x="450" y="390">r=10 (w=20)</text>

  <line class="thin" x1="330" y1="430" x2="440" y2="414"/>
  <circle class="term" cx="440" cy="414" r="3.5"/>
  <text class="rlbl" x="450" y="418">r=&#8722;10 (w=5)</text>
  <line class="thin" x1="330" y1="430" x2="440" y2="446"/>
  <circle class="term" cx="440" cy="446" r="3.5"/>
  <text class="rlbl" x="450" y="450">r=20 (w=20)</text>

  <g transform="translate(600,380)">
    <text class="plbl" x="0" y="0">Q(rain,·,·) subtree:</text>
    <text class="plbl" x="0" y="16">Q(a=10)  = 2.5</text>
    <text class="plbl" x="0" y="32">Q(a=20)  = &#8722;2.5</text>
  </g>

  <!-- ============= Subtree D: S=rain, Y=right  ============= -->
  <line class="edge" x1="227" y1="540" x2="330" y2="510"/>
  <rect class="box" x="255" y="515" width="40" height="14"/>
  <text class="lbl" x="275" y="526" text-anchor="middle">a=10</text>
  <circle class="ch" cx="330" cy="510" r="6"/>

  <line class="edge" x1="227" y1="540" x2="330" y2="570"/>
  <rect class="box" x="255" y="547" width="40" height="14"/>
  <text class="lbl" x="275" y="558" text-anchor="middle">a=20</text>
  <circle class="ch" cx="330" cy="570" r="6"/>

  <line class="thin" x1="330" y1="510" x2="440" y2="494"/>
  <circle class="term" cx="440" cy="494" r="3.5"/>
  <text class="rlbl" x="450" y="498">r=0   (w=5)</text>
  <line class="thin" x1="330" y1="510" x2="440" y2="526"/>
  <circle class="term" cx="440" cy="526" r="3.5"/>
  <text class="rlbl" x="450" y="530">r=10 (w=20)</text>

  <line class="thin" x1="330" y1="570" x2="440" y2="554"/>
  <circle class="term" cx="440" cy="554" r="3.5"/>
  <text class="rlbl" x="450" y="558">r=&#8722;10 (w=5)</text>
  <line class="thin" x1="330" y1="570" x2="440" y2="586"/>
  <circle class="term" cx="440" cy="586" r="3.5"/>
  <text class="rlbl" x="450" y="590">r=20 (w=20)</text>

  <g transform="translate(600,520)">
    <text class="plbl" x="0" y="0">Q(rain,·,·) subtree:</text>
    <text class="plbl" x="0" y="16">Q(a=10)  = 2.5</text>
    <text class="plbl" x="0" y="32">Q(a=20)  = &#8722;2.5</text>
  </g>
</svg>

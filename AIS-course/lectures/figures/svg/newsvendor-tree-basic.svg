<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Latin Modern Math','STIX Two Math','Times New Roman',serif" font-size="15">
  <style>
    .edge { stroke:#6c757d; stroke-width:1.6; fill:none; }
    .thin { stroke:#adb5bd; stroke-width:1.2; fill:none; }
    .dec  { fill:#ffffff; stroke:#0d6efd; stroke-width:1.8; }
    .ch   { fill:#ffffff; stroke:#198754; stroke-width:1.8; }
    .term { fill:#ffffff; stroke:#adb5bd; stroke-width:1.2; }
    .lbl  { fill:#212529; }
    .plbl { fill:#495057; font-size:13px; }
    .rlbl { fill:#212529; font-weight:500; }
    .box  { fill:#ffffff; }
  </style>

  <!-- legend -->
  <g transform="translate(20,20)" class="plbl">
    <rect class="dec" x="0" y="0" width="14" height="14"/>
    <text x="22" y="12">decision node</text>
    <circle class="ch" cx="130" cy="7" r="7"/>
    <text x="144" y="12">chance node</text>
  </g>

  <!-- ROOT (decision: choose a before seeing W) -->
  <rect class="dec" x="53" y="173" width="14" height="14"/>
  <text class="plbl" x="60" y="158" text-anchor="middle">a</text>

  <!-- root -> a=10 -->
  <line class="edge" x1="67" y1="180" x2="200" y2="90"/>
  <rect class="box" x="100" y="122" width="46" height="18"/>
  <text class="lbl" x="123" y="135" text-anchor="middle">a=10</text>
  <circle class="ch" cx="200" cy="90" r="7"/>
  <text class="plbl" x="200" y="75" text-anchor="middle">W</text>

  <!-- root -> a=20 -->
  <line class="edge" x1="67" y1="180" x2="200" y2="270"/>
  <rect class="box" x="100" y="212" width="46" height="18"/>
  <text class="lbl" x="123" y="225" text-anchor="middle">a=20</text>
  <circle class="ch" cx="200" cy="270" r="7"/>
  <text class="plbl" x="200" y="255" text-anchor="middle">W</text>

  <!-- a=10 -> W=5, W=20 -->
  <line class="thin" x1="200" y1="90" x2="360" y2="50"/>
  <rect class="box" x="255" y="52" width="70" height="18"/>
  <text class="lbl" x="290" y="65" text-anchor="middle">w=5, 1/4</text>
  <circle class="term" cx="360" cy="50" r="4"/>
  <text class="rlbl" x="380" y="54">r = 0</text>

  <line class="thin" x1="200" y1="90" x2="360" y2="130"/>
  <rect class="box" x="255" y="102" width="70" height="18"/>
  <text class="lbl" x="290" y="115" text-anchor="middle">w=20, 3/4</text>
  <circle class="term" cx="360" cy="130" r="4"/>
  <text class="rlbl" x="380" y="134">r = 10</text>

  <!-- a=20 -> W=5, W=20 -->
  <line class="thin" x1="200" y1="270" x2="360" y2="230"/>
  <rect class="box" x="255" y="232" width="70" height="18"/>
  <text class="lbl" x="290" y="245" text-anchor="middle">w=5, 1/4</text>
  <circle class="term" cx="360" cy="230" r="4"/>
  <text class="rlbl" x="380" y="234">r = &#8722;10</text>

  <line class="thin" x1="200" y1="270" x2="360" y2="310"/>
  <rect class="box" x="255" y="282" width="70" height="18"/>
  <text class="lbl" x="290" y="295" text-anchor="middle">w=20, 3/4</text>
  <circle class="term" cx="360" cy="310" r="4"/>
  <text class="rlbl" x="380" y="314">r = 20</text>

  <!-- expected rewards -->
  <text class="plbl" x="500" y="94">Q(10) = 7.5</text>
  <text class="plbl" x="500" y="274">Q(20) = 12.5</text>
</svg>

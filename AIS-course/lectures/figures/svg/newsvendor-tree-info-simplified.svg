<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Latin Modern Math','STIX Two Math','Times New Roman',serif" font-size="15">
  <style>
    .edge { stroke:#6c757d; stroke-width:1.6; fill:none; }
    .dec  { fill:#ffffff; stroke:#0d6efd; stroke-width:1.8; }
    .ch   { fill:#ffffff; stroke:#198754; stroke-width:1.8; }
    .term { fill:#ffffff; stroke:#adb5bd; stroke-width:1.2; }
    .hi   { fill:#fff59d; stroke:#212529; stroke-width:1.6; }
    .lbl  { fill:#212529; }
    .plbl { fill:#495057; font-size:13px; }
    .rlbl { fill:#212529; font-weight:500; }
    .box  { fill:#ffffff; }
  </style>

  <!-- ROOT (chance: weather S) -->
  <circle class="ch" cx="50" cy="210" r="8"/>
  <text class="plbl" x="50" y="195" text-anchor="middle">S</text>

  <!-- root -> sunny -->
  <line class="edge" x1="58" y1="210" x2="160" y2="100"/>
  <rect class="box" x="80" y="142" width="90" height="18"/>
  <text class="lbl" x="125" y="155" text-anchor="middle">S = sunny, 1/2</text>
  <rect class="dec" x="153" y="93" width="14" height="14"/>

  <!-- root -> rainy -->
  <line class="edge" x1="58" y1="210" x2="160" y2="320"/>
  <rect class="box" x="80" y="252" width="90" height="18"/>
  <text class="lbl" x="125" y="265" text-anchor="middle">S = rainy, 1/2</text>
  <rect class="dec" x="153" y="313" width="14" height="14"/>

  <!-- ===== SUNNY decision ===== -->
  <!-- a=10 -->
  <line class="edge" x1="167" y1="100" x2="340" y2="55"/>
  <rect class="box" x="220" y="65" width="46" height="18"/>
  <text class="lbl" x="243" y="78" text-anchor="middle">a=10</text>
  <circle class="term" cx="340" cy="55" r="4"/>
  <text class="rlbl" x="360" y="59">Q = 7.5</text>

  <!-- a=20 (optimal for sunny) -->
  <line class="edge" x1="167" y1="100" x2="340" y2="145" stroke="#212529" stroke-width="2.2"/>
  <rect class="hi" x="220" y="110" width="46" height="18" rx="2"/>
  <text class="lbl" x="243" y="123" text-anchor="middle">a=20</text>
  <circle class="term" cx="340" cy="145" r="4"/>
  <text class="rlbl" x="360" y="149">Q = 12.5</text>
  <text class="plbl" x="500" y="149">V*(sunny) = 12.5</text>

  <!-- ===== RAINY decision ===== -->
  <!-- a=10 (optimal for rainy) -->
  <line class="edge" x1="167" y1="320" x2="340" y2="275" stroke="#212529" stroke-width="2.2"/>
  <rect class="hi" x="220" y="285" width="46" height="18" rx="2"/>
  <text class="lbl" x="243" y="298" text-anchor="middle">a=10</text>
  <circle class="term" cx="340" cy="275" r="4"/>
  <text class="rlbl" x="360" y="279">Q = 2.5</text>
  <text class="plbl" x="500" y="279">V*(rainy) = 2.5</text>

  <!-- a=20 -->
  <line class="edge" x1="167" y1="320" x2="340" y2="365"/>
  <rect class="box" x="220" y="330" width="46" height="18"/>
  <text class="lbl" x="243" y="343" text-anchor="middle">a=20</text>
  <circle class="term" cx="340" cy="365" r="4"/>
  <text class="rlbl" x="360" y="369">Q = &#8722;2.5</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" font-family="'Latin Modern Math','STIX Two Math','Times New Roman',serif" font-size="15">
  <style>
    .edge { stroke:#6c757d; stroke-width:1.6; fill:none; }
    .dec  { fill:#ffffff; stroke:#0d6efd; stroke-width:1.8; }
    .term { fill:#ffffff; stroke:#adb5bd; stroke-width:1.2; }
    .hi   { fill:#fff59d; stroke:#212529; stroke-width:1.6; }
    .lbl  { fill:#212529; }
    .plbl { fill:#495057; font-size:13px; }
    .rlbl { fill:#212529; font-weight:500; }
    .box  { fill:#ffffff; }
  </style>

  <!-- ROOT (decision: choose a) -->
  <rect class="dec" x="53" y="133" width="14" height="14"/>
  <text class="plbl" x="60" y="118" text-anchor="middle">a</text>

  <!-- root -> a=10 -->
  <line class="edge" x1="67" y1="140" x2="220" y2="70"/>
  <rect class="box" x="110" y="92" width="46" height="18"/>
  <text class="lbl" x="133" y="105" text-anchor="middle">a=10</text>
  <circle class="term" cx="220" cy="70" r="4"/>
  <text class="rlbl" x="240" y="74">Q(10) = 7.5</text>

  <!-- root -> a=20 (optimal) -->
  <line class="edge" x1="67" y1="140" x2="220" y2="210" stroke="#212529" stroke-width="2.2"/>
  <rect class="hi" x="110" y="162" width="46" height="18" rx="2"/>
  <text class="lbl" x="133" y="175" text-anchor="middle">a=20</text>
  <circle class="term" cx="220" cy="210" r="4"/>
  <text class="rlbl" x="240" y="214">Q(20) = 12.5</text>
</svg>

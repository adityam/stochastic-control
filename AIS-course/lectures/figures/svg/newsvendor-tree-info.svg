<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="'Latin Modern Math','STIX Two Math','Times New Roman',serif" font-size="15">
  <style>
    .edge { stroke:#6c757d; stroke-width:1.6; fill:none; }
    .thin { stroke:#adb5bd; stroke-width:1.2; fill:none; }
    .dec  { fill:#ffffff; stroke:#0d6efd; stroke-width:1.8; }
    .ch   { fill:#ffffff; stroke:#198754; stroke-width:1.8; }
    .term { fill:#ffffff; stroke:#adb5bd; stroke-width:1.2; }
    .lbl  { fill:#212529; }
    .plbl { fill:#495057; font-size:13px; }
    .rlbl { fill:#212529; font-weight:500; }
    .box  { fill:#ffffff; }
    .title{ fill:#6c757d; font-size:14px; }
  </style>

  <!-- ROOT (chance: weather S) -->
  <circle class="ch" cx="60" cy="280" r="8"/>
  <text class="plbl" x="60" y="265" text-anchor="middle">S</text>

  <!-- root -> Sunny state (top) -->
  <line class="edge" x1="60" y1="280" x2="170" y2="140"/>
  <rect class="box" x="90" y="197" width="90" height="18"/>
  <text class="lbl" x="135" y="210" text-anchor="middle">S = sunny, 1/2</text>

  <!-- root -> Rainy state (bottom) -->
  <line class="edge" x1="60" y1="280" x2="170" y2="420"/>
  <rect class="box" x="90" y="345" width="90" height="18"/>
  <text class="lbl" x="135" y="358" text-anchor="middle">S = rainy, 1/2</text>

  <!-- Sunny decision node -->
  <rect class="dec" x="163" y="133" width="14" height="14"/>

  <!-- Rainy decision node -->
  <rect class="dec" x="163" y="413" width="14" height="14"/>

  <!-- ===== SUNNY subtree ===== -->
  <!-- Sunny decision -> a=10 chance (row y=70) -->
  <line class="edge" x1="177" y1="140" x2="320" y2="70"/>
  <rect class="box" x="230" y="97" width="46" height="18"/>
  <text class="lbl" x="253" y="110" text-anchor="middle">a=10</text>
  <circle class="ch" cx="320" cy="70" r="7"/>

  <!-- Sunny decision -> a=20 chance (row y=210) -->
  <line class="edge" x1="177" y1="140" x2="320" y2="210"/>
  <rect class="box" x="230" y="167" width="46" height="18"/>
  <text class="lbl" x="253" y="180" text-anchor="middle">a=20</text>
  <circle class="ch" cx="320" cy="210" r="7"/>

  <!-- Sunny a=10 -> W=5 (y=50), W=20 (y=90) -->
  <line class="thin" x1="320" y1="70" x2="470" y2="50"/>
  <rect class="box" x="378" y="52" width="42" height="16"/>
  <text class="lbl" x="399" y="63" text-anchor="middle">w=5</text>
  <circle class="term" cx="470" cy="50" r="4"/>
  <text class="rlbl" x="490" y="54">r = 0</text>

  <line class="thin" x1="320" y1="70" x2="470" y2="90"/>
  <rect class="box" x="378" y="72" width="42" height="16"/>
  <text class="lbl" x="399" y="83" text-anchor="middle">w=20</text>
  <circle class="term" cx="470" cy="90" r="4"/>
  <text class="rlbl" x="490" y="94">r = 10</text>

  <!-- Sunny a=20 -> W=5 (y=190), W=20 (y=230) -->
  <line class="thin" x1="320" y1="210" x2="470" y2="190"/>
  <rect class="box" x="378" y="192" width="42" height="16"/>
  <text class="lbl" x="399" y="203" text-anchor="middle">w=5</text>
  <circle class="term" cx="470" cy="190" r="4"/>
  <text class="rlbl" x="490" y="194">r = &#8722;10</text>

  <line class="thin" x1="320" y1="210" x2="470" y2="230"/>
  <rect class="box" x="378" y="212" width="42" height="16"/>
  <text class="lbl" x="399" y="223" text-anchor="middle">w=20</text>
  <circle class="term" cx="470" cy="230" r="4"/>
  <text class="rlbl" x="490" y="234">r = 20</text>

  <!-- Sunny PMF labels next to demand edges -->
  <text class="plbl" x="565" y="54">(prob 1/4)</text>
  <text class="plbl" x="565" y="94">(prob 3/4)</text>
  <text class="plbl" x="565" y="194">(prob 1/4)</text>
  <text class="plbl" x="565" y="234">(prob 3/4)</text>

  <!-- ===== RAINY subtree ===== -->
  <!-- Rainy decision -> a=10 chance (row y=350) -->
  <line class="edge" x1="177" y1="420" x2="320" y2="350"/>
  <rect class="box" x="230" y="377" width="46" height="18"/>
  <text class="lbl" x="253" y="390" text-anchor="middle">a=10</text>
  <circle class="ch" cx="320" cy="350" r="7"/>

  <!-- Rainy decision -> a=20 chance (row y=490) -->
  <line class="edge" x1="177" y1="420" x2="320" y2="490"/>
  <rect class="box" x="230" y="447" width="46" height="18"/>
  <text class="lbl" x="253" y="460" text-anchor="middle">a=20</text>
  <circle class="ch" cx="320" cy="490" r="7"/>

  <!-- Rainy a=10 -> W=5 (y=330), W=20 (y=370) -->
  <line class="thin" x1="320" y1="350" x2="470" y2="330"/>
  <rect class="box" x="378" y="332" width="42" height="16"/>
  <text class="lbl" x="399" y="343" text-anchor="middle">w=5</text>
  <circle class="term" cx="470" cy="330" r="4"/>
  <text class="rlbl" x="490" y="334">r = 0</text>

  <line class="thin" x1="320" y1="350" x2="470" y2="370"/>
  <rect class="box" x="378" y="352" width="42" height="16"/>
  <text class="lbl" x="399" y="363" text-anchor="middle">w=20</text>
  <circle class="term" cx="470" cy="370" r="4"/>
  <text class="rlbl" x="490" y="374">r = 10</text>

  <!-- Rainy a=20 -> W=5 (y=470), W=20 (y=510) -->
  <line class="thin" x1="320" y1="490" x2="470" y2="470"/>
  <rect class="box" x="378" y="472" width="42" height="16"/>
  <text class="lbl" x="399" y="483" text-anchor="middle">w=5</text>
  <circle class="term" cx="470" cy="470" r="4"/>
  <text class="rlbl" x="490" y="474">r = &#8722;10</text>

  <line class="thin" x1="320" y1="490" x2="470" y2="510"/>
  <rect class="box" x="378" y="492" width="42" height="16"/>
  <text class="lbl" x="399" y="503" text-anchor="middle">w=20</text>
  <circle class="term" cx="470" cy="510" r="4"/>
  <text class="rlbl" x="490" y="514">r = 20</text>

  <!-- Rainy PMF labels -->
  <text class="plbl" x="565" y="334">(prob 3/4)</text>
  <text class="plbl" x="565" y="374">(prob 1/4)</text>
  <text class="plbl" x="565" y="474">(prob 3/4)</text>
  <text class="plbl" x="565" y="514">(prob 1/4)</text>

  <!-- Dashed information-set boxes are omitted here; the tree diagram makes
       the informational structure clear since S is observed. -->
</svg>

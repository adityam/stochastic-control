<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="'Latin Modern Math','STIX Two Math','Times New Roman',serif" font-size="15">
  <style>
    .edge { stroke:#6c757d; stroke-width:1.6; fill:none; }
    .ch   { fill:#ffffff; stroke:#198754; stroke-width:1.8; }
    .term { fill:#ffffff; stroke:#adb5bd; stroke-width:1.2; }
    .lbl  { fill:#212529; }
    .plbl { fill:#495057; font-size:13px; }
    .rlbl { fill:#212529; font-weight:500; }
    .box  { fill:#ffffff; }
  </style>

  <!-- ROOT (chance: weather S) -->
  <circle class="ch" cx="60" cy="150" r="8"/>
  <text class="plbl" x="60" y="135" text-anchor="middle">S</text>
  <text class="rlbl" x="60" y="185" text-anchor="middle">J = 7.5</text>

  <!-- root -> sunny -->
  <line class="edge" x1="68" y1="150" x2="260" y2="80"/>
  <rect class="box" x="120" y="102" width="90" height="18"/>
  <text class="lbl" x="165" y="115" text-anchor="middle">S = sunny, 1/2</text>
  <circle class="term" cx="260" cy="80" r="4"/>
  <text class="rlbl" x="280" y="84">V*(sunny) = 12.5</text>

  <!-- root -> rainy -->
  <line class="edge" x1="68" y1="150" x2="260" y2="220"/>
  <rect class="box" x="120" y="172" width="90" height="18"/>
  <text class="lbl" x="165" y="185" text-anchor="middle">S = rainy, 1/2</text>
  <circle class="term" cx="260" cy="220" r="4"/>
  <text class="rlbl" x="280" y="224">V*(rainy) = 2.5</text>
</svg>
